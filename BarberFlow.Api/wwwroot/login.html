<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del barbero</title>
  <link rel="manifest" href="/manifest-admin.json">
  <meta name="theme-color" content="#0B0F19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BarberFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/bf-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/bf-64.png">
  <link rel="apple-touch-icon" href="/icons/bf-apple-180.png">
  <link rel="stylesheet" href="/css/app.css?v=20261126c">
  <script src="/js/iconos.js?v=20261126c"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0B0F19; color: #F3F4F6; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
    .campo { width: 100%; background: #030712; border: 1px solid #374151; border-radius: 0.75rem; padding: 0.75rem 0.9rem; font-size: 0.95rem; color: #fff; outline: none; transition: border-color .15s; }
    .campo:focus { border-color: #3B82F6; }
    .etiqueta { display: block; font-size: 0.75rem; font-weight: 600; color: #9CA3AF; margin-bottom: 0.35rem; }
    .tab-activa { background: #1F2937; color: #fff; }
    .tab-inactiva { color: #9CA3AF; }
    .oculto { display: none !important; }
  </style>
  <script>
    // Si ya hay una sesión vigente (por ejemplo, al abrir la app instalada), ir directo a la agenda
    (function () {
      try {
        const token = localStorage.getItem('bf_token');
        const payload = token && JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        if (payload && payload.exp * 1000 > Date.now() + 60000) location.replace('/admin.html');
      } catch (e) {}
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <main class="w-full max-w-sm">
    <div class="text-center mb-6">
      <img src="/img/barberflow-logo.webp" alt="BarberFlow" width="560" height="541" class="w-48 sm:w-56 h-auto mx-auto -mb-2" style="mix-blend-mode: lighten">
      <h1 class="text-2xl font-extrabold text-white mt-1">Panel del barbero</h1>
      <p class="text-sm text-gray-400 mt-1">Tu agenda, tus clientes y tu bot en un solo lugar.</p>
    </div>

    <div class="bg-gray-900/80 border border-gray-800 rounded-3xl p-5 sm:p-6 shadow-xl">
      <div class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-gray-950 border border-gray-800 mb-5">
        <button id="tab-login" type="button" onclick="cambiarTab('login')" class="py-2 rounded-lg text-sm font-bold transition tab-activa">Ingresar</button>
        <button id="tab-register" type="button" onclick="cambiarTab('register')" class="py-2 rounded-lg text-sm font-bold transition tab-inactiva">Crear barbería</button>
      </div>

      <p id="auth-error" class="oculto mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-xs font-medium"></p>

      <!-- Ingresar -->
      <form id="form-login" onsubmit="hacerLogin(event)" class="space-y-4">
        <div>
          <label class="etiqueta" for="login-email">Correo</label>
          <input type="email" id="login-email" autocomplete="email" inputmode="email" required placeholder="tu_correo@gmail.com" class="campo">
        </div>
        <div>
          <label class="etiqueta" for="login-pass">Contraseña</label>
          <div class="relative">
            <input type="password" id="login-pass" autocomplete="current-password" required placeholder="Tu contraseña" class="campo pr-11">
            <button type="button" onclick="togglePasswordVisibility('login-pass', this)" class="absolute right-2 top-1/2 transform -translate-y-1/2 p-1.5 text-gray-500 hover:text-gray-300" aria-label="Mostrar contraseña">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <button type="submit" id="btn-login" class="w-full py-3.5 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-500 disabled:opacity-60 shadow-lg shadow-blue-600/25 transition">Entrar</button>
        <p class="text-center text-[11px] text-gray-500">Tu sesión queda guardada en este celular: no tendrás que escribir la contraseña cada vez.</p>
        <button type="button" onclick="mostrarRecuperacion()" class="block mx-auto text-xs font-semibold text-blue-300 hover:text-blue-200">¿Olvidaste tu contraseña?</button>
      </form>

      <!-- Recuperar contraseña con un código por WhatsApp -->
      <form id="form-recuperar" onsubmit="enviarRecuperacion(event)" class="space-y-4 oculto">
        <div>
          <p class="text-sm font-bold text-white">Recuperar contraseña</p>
          <p class="text-xs text-gray-400 mt-1">Te enviamos un código de 6 dígitos al WhatsApp de tu barbería.</p>
        </div>
        <div id="rec-paso-correo">
          <label class="etiqueta" for="rec-email">Correo de tu cuenta</label>
          <input type="email" id="rec-email" autocomplete="email" inputmode="email" placeholder="tu_correo@gmail.com" class="campo">
        </div>
        <div id="rec-paso-codigo" class="oculto space-y-4">
          <p id="rec-mensaje" class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-200 text-xs leading-relaxed"></p>
          <div>
            <label class="etiqueta" for="rec-codigo">Código de 6 dígitos</label>
            <input type="text" id="rec-codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" class="campo text-center text-lg font-bold tracking-[0.5em]">
          </div>
          <div>
            <label class="etiqueta" for="rec-pass">Contraseña nueva</label>
            <div class="relative">
              <input type="password" id="rec-pass" autocomplete="new-password" minlength="6" placeholder="Mínimo 6 caracteres" class="campo pr-11">
              <button type="button" onclick="togglePasswordVisibility('rec-pass', this)" class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-gray-500 hover:text-gray-300" aria-label="Mostrar contraseña"><i data-lucide="eye" class="w-4 h-4"></i></button>
            </div>
          </div>
          <button type="button" id="rec-reenviar" onclick="reenviarCodigoRecuperacion()" class="text-xs font-semibold text-gray-400 hover:text-white disabled:opacity-50">Reenviar código</button>
        </div>
        <button type="submit" id="btn-recuperar" class="w-full py-3.5 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-500 disabled:opacity-60 shadow-lg shadow-blue-600/25 transition">Enviarme el código</button>
        <button type="button" onclick="volverAlLogin()" class="block mx-auto text-xs font-semibold text-gray-400 hover:text-white">← Volver a ingresar</button>
      </form>

      <!-- Crear barbería -->
      <form id="form-register" onsubmit="hacerRegistro(event)" class="space-y-4 oculto">
        <div>
          <label class="etiqueta" for="reg-name">Tu nombre</label>
          <input type="text" id="reg-name" autocomplete="name" required maxlength="60" placeholder="Ej: Juan Pérez" class="campo">
        </div>
        <div>
          <label class="etiqueta" for="reg-barberia">Nombre de tu barbería</label>
          <input type="text" id="reg-barberia" required maxlength="60" placeholder="Ej: Barbería El Estilo" class="campo">
        </div>
        <div>
          <label class="etiqueta" for="reg-phone">WhatsApp de la barbería</label>
          <div class="flex gap-2">
            <select id="reg-pais" class="campo cursor-pointer" style="width:auto" aria-label="Indicativo del país">
              <option value="+57">🇨🇴 +57</option><option value="+1">🇺🇸 +1</option><option value="+34">🇪🇸 +34</option>
              <option value="+52">🇲🇽 +52</option><option value="+54">🇦🇷 +54</option><option value="+56">🇨🇱 +56</option>
              <option value="+51">🇵🇪 +51</option><option value="+58">🇻🇪 +58</option><option value="+593">🇪🇨 +593</option><option value="+507">🇵🇦 +507</option>
            </select>
            <input type="tel" id="reg-phone" inputmode="tel" required placeholder="300 123 4567" class="campo">
          </div>
        </div>
        <div>
          <label class="etiqueta" for="reg-email">Correo</label>
          <input type="email" id="reg-email" autocomplete="email" inputmode="email" required placeholder="tu_correo@gmail.com" class="campo">
        </div>
        <div>
          <label class="etiqueta" for="reg-pass">Crea una contraseña</label>
          <div class="relative">
            <input type="password" id="reg-pass" autocomplete="new-password" minlength="6" required placeholder="Mínimo 6 caracteres" class="campo pr-11">
            <button type="button" onclick="togglePasswordVisibility('reg-pass', this)" class="absolute right-2 top-1/2 transform -translate-y-1/2 p-1.5 text-gray-500 hover:text-gray-300" aria-label="Mostrar contraseña">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <label class="flex items-start gap-2.5 text-xs text-gray-400 cursor-pointer">
          <input type="checkbox" id="reg-privacidad" required class="mt-0.5 w-4 h-4 accent-emerald-500 flex-shrink-0">
          <span>Acepto la <a href="/privacidad.html" target="_blank" class="text-emerald-300 underline">política de privacidad</a> y el tratamiento de los datos de mi barbería y de mis clientes.</span>
        </label>
        <button type="submit" id="btn-register" class="w-full py-3.5 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-500 disabled:opacity-60 shadow-lg shadow-emerald-600/25 transition">Crear mi barbería</button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-600 mt-6">BarberFlow · Reservas para barberías</p>
  </main>

  <script src="/js/auth.js?v=20261126c"></script>
  <script>
    lucide.createIcons();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
